[package]
name = "libtpms-rs-compat"
version = "0.1.0"
edition = "2024"
description = "Rust reimplementation of the libtpms ABI (work in progress)"
license-file = "LICENSE"
publish = false

[lib]
name = "tpms"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
aes = { version = "0.8", default-features = false }
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false, features = ["compress"] }
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
subtle = { version = "2.6", default-features = false }
des = { version = "0.8", default-features = false }
camellia = { version = "0.1", default-features = false }

[features]
default = ["tpm2"]
tpm1 = []
tpm2 = []
