[package]
name = "libtpms-rs-compat"
version = "0.1.0"
edition = "2024"
description = "Rust reimplementation of the libtpms ABI (work in progress)"
license = "BSD-3-Clause"
publish = false

[lib]
name = "tpms"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
aes = { version = "0.8", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

[features]
default = ["tpm2"]
tpm1 = []
tpm2 = []
