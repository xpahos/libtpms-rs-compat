[package]
name = "tpms-timing-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
description = "Timing-fuzzing for libtpms cryptographic commands with LibAFL search and upstream dudect verification"
license-file = "../LICENSE"
build = "build.rs"

[workspace]

[lib]
name = "tpms_timing_tests"
path = "src/lib.rs"

[[bin]]
name = "tpms-timing-tests"
path = "src/main.rs"

[dependencies]
libafl = { version = "=0.16.1", default-features = false, features = ["std", "derive", "serdeany_autoreg"] }
libafl_bolts = { version = "=0.16.1", default-features = false, features = ["std", "derive", "serdeany_autoreg"] }
p521 = { version = "=0.13.3", default-features = false, features = ["arithmetic", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
hex = "=0.4.3"
libc = "=0.2.190"
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
num-integer = "=0.1.46"
aes = "=0.8.4"
camellia = "=0.1.0"
des = "=0.8.1"
hmac = "=0.12.1"
sha1 = "0.10"

[profile.release]
debug = 1
